name: Build and publish Debian MCP image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "server.py"
      - "requirements.txt"
      - "nginx.conf"
      - "start-with-radius.sh"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/roplizeramr-blip/debian-root-mcp:latest
            ghcr.io/roplizeramr-blip/debian-root-mcp:${{ github.sha }}
